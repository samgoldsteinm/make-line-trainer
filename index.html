<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}

<style>
/* Layout: a make-line station. Build card on top, the board in the middle, topping rail below, like working the line. */
:root{
  --bg:#edf1f6; --surface:#ffffff; --surface2:#e2e8f0; --ink:#13233a; --muted:#56677e; --line:#cdd6e2;
  --band:#0b4f93; --bandInk:#ffffff; --blue:#0a5aa6; --red:#d1372a; --redInk:#ffffff;
  --good:#1d8549; --goodBg:#e3f4ea; --warn:#a86a12; --warnBg:#fbf0dc; --bad:#bf3326; --badBg:#fbe6e3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --surface:#172130; --surface2:#213043; --ink:#e6edf6; --muted:#95a6bc; --line:#2b3a50;
  --band:#123a66; --bandInk:#ffffff; --blue:#62acf2; --red:#f0584a; --redInk:#ffffff;
  --good:#53c98a; --goodBg:#163627; --warn:#e6ad52; --warnBg:#3a2c14; --bad:#ff7d6e; --badBg:#3d1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#172130; --surface2:#213043; --ink:#e6edf6; --muted:#95a6bc; --line:#2b3a50;
  --band:#123a66; --bandInk:#ffffff; --blue:#62acf2; --red:#f0584a; --redInk:#ffffff;
  --good:#53c98a; --goodBg:#163627; --warn:#e6ad52; --warnBg:#3a2c14; --bad:#ff7d6e; --badBg:#3d1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{background:var(--band);color:var(--bandInk);padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in,.wrap{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand span{font-size:13px;opacity:.8}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{background:transparent;border:0;color:var(--bandInk);opacity:.75;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--red);color:var(--redInk);font-size:12px;line-height:20px;text-align:center}
.wrap{padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15);color:var(--blue)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--redInk)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.btn.big{font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.order-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.order-card .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.order-card .nm{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase}
.pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;padding:2px 10px;border-radius:20px;background:var(--surface2);margin-left:6px;vertical-align:middle}
.pill.red{background:var(--red);color:var(--redInk)}
.station{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.station{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.board svg{width:100%;max-width:420px;display:block;margin:0 auto;height:auto}
.panel h3{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.layers li{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:6px 8px;background:var(--surface2);border-radius:8px}
.layers .n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.layers .a{font-weight:700}
.ib{border:0;background:transparent;width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:15px}
.ib:hover{background:var(--surface)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.rail{margin-top:16px}
.rail-group{margin-bottom:12px}
.rail-group h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px 6px 7px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--blue)}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,22,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet-in{max-width:560px;margin:0 auto}
.sheet h2{font-family:var(--display);font-size:24px;text-transform:uppercase;margin:0 0 2px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:14px}
.amts{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-bottom:12px}
.amt{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px 4px;font-family:var(--display);font-weight:700;font-size:22px}
.amt small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted)}
.amt:hover{border-color:var(--blue)}
.result{margin-top:16px}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.score .pct{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.score .verdict{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stat{font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface2)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.gstart td{border-top:2px dotted var(--red)}
td.num,th.num{text-align:right;white-space:nowrap}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.row-miss td{background:var(--badBg)}
.row-extra td{background:var(--warnBg)}
.v-good{color:var(--good)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
.timer{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.rushbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rushbar .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rushbar .v{font-family:var(--display);font-weight:700;font-size:26px}
.setup{max-width:560px}
.setup h2,.study-h{font-family:var(--display);font-size:28px;text-transform:uppercase;margin:0 0 6px}
.setup p{color:var(--muted);margin:0 0 16px}
.field{margin-bottom:14px}
.field .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.card svg{width:100%;max-width:260px;margin:0 auto;display:block;height:auto}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.key{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.key h3{font-family:var(--display);font-size:20px;text-transform:uppercase;margin:0 0 8px}
.key ul{margin:0;padding-left:18px}
.key li{margin-bottom:4px;max-width:70ch}
.review-list{display:flex;flex-direction:column;gap:8px}
.review-item{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.review-item b{font-family:var(--display);font-size:19px;text-transform:uppercase}
.muted{color:var(--muted)}
.dcard{max-width:640px}
.dcard .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dq{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:6px 0 14px;text-wrap:balance}
.dopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dopt{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px 8px;font-family:var(--display);font-weight:700;font-size:22px}
.dopt:not(:disabled):hover{border-color:var(--blue)}
.dopt:disabled{cursor:default}
.dopt.correct{border-color:var(--good);background:var(--goodBg);color:var(--good)}
.dopt.wrong{border-color:var(--bad);background:var(--badBg);color:var(--bad)}
.dfb{margin-top:12px;font-weight:700}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.chart td{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>

function options(ing,cat,size){
  let s=AMTS[cat]&&AMTS[cat][ing]?[...AMTS[cat][ing]]:[];

  const u=unit(ing);
  const ladder=u!=='oz'?[2,4,6,7,9,12,16,18,20,24,32,38,46]:(ing==='oregano'||ing==='garlicherb')?[.01,.02,.03,.04,.05]:[.2,.5,.7,1,1.5,2,2.5,3,3.5,4,4.5,5,6];
  const mid=s.length?s.slice().sort((a,b)=>a-b)[Math.floor(s.length/2)]:ladder[3];
  while(s.length<5){const c=ladder.filter(v=>!s.some(x=>eq(x,v))).sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid))[0];if(c===undefined)break;s.push(c)}
  return s.sort((a,b)=>a-b);
}

// ---------- Grading ----------
function grade(req,user){
  const used=user.map(()=>false);const rows=req.map(r=>{
    let i=user.findIndex((u,j)=>!used[j]&&u.ing===r.ing&&eq(u.amt,r.amt));
    if(i<0)i=user.findIndex((u,j)=>!used[j]&&u.ing===r.ing);
    if(i>=0){used[i]=true;return{r,ui:i,got:user[i].amt,portion:eq(user[i].amt,r.amt),order:false}}
    return{r,ui:-1,got:null,portion:false,order:false};
  });
  // order: longest non-decreasing run of step groups in the order you placed them
  const m=rows.filter(x=>x.ui>=0).sort((a,b)=>a.ui-b.ui);
  const L=m.map(()=>1),P=m.map(()=>-1);
  for(let i=0;i<m.length;i++)for(let j=0;j<i;j++)if(m[j].r.g<=m[i].r.g&&L[j]+1>L[i]){L[i]=L[j]+1;P[i]=j}
  let bi=-1,bv=0;L.forEach((v,i)=>{if(v>bv){bv=v;bi=i}});
  while(bi>=0){m[bi].order=true;bi=P[bi]}
  const extras=user.map((u,j)=>used[j]?null:{...u,pos:j}).filter(Boolean);
  const n=req.length,found=rows.filter(x=>x.ui>=0).length,por=rows.filter(x=>x.portion).length,ord=rows.filter(x=>x.order).length;
  const earned=Math.max(0,found+por+ord-extras.length);
  const pct=Math.round(earned/(3*n)*100);
  return{rows,extras,n,found,por,ord,pct};
}

function countFor(ing,amt){
  const u=unit(ing);
  if(u!=='oz')return Math.round(amt);
  if(ing==='oregano'||ing==='garlicherb')return Math.round(70*amt/0.03);
  return Math.min(240,Math.max(2,Math.round((DENS[ing]||12)*amt)));
}
function drawSvg(cat,layers,size){
  if(cat==='byo')cat='pizza';
  const id='c'+(++uid);let base='',clip='';
  if(cat==='pasta'){
    clip=`<clipPath id="${id}"><circle cx="150" cy="150" r="118"/></clipPath>`;
    base=`<circle cx="150" cy="150" r="140" fill="#aab1ba"/><circle cx="150" cy="150" r="130" fill="#cfd4da" stroke="#9aa2ad" stroke-width="2" stroke-dasharray="3 3"/><circle cx="150" cy="150" r="120" fill="#e3e6ea"/>`;
  }else if(cat==='domino'){
    clip=`<clipPath id="${id}"><rect x="28" y="82" width="244" height="136" rx="10"/></clipPath>`;
    base=`<rect x="16" y="70" width="268" height="160" rx="16" fill="#3b3f45"/><rect x="22" y="76" width="256" height="148" rx="12" fill="#d9a85c"/><rect x="28" y="82" width="244" height="136" rx="10" fill="#f1dcae"/><line x1="150" y1="78" x2="150" y2="222" stroke="#3b3f45" stroke-width="3"/>`;
  }else if(cat==='bread'){
    clip=`<clipPath id="${id}"><rect x="40" y="72" width="220" height="156" rx="16"/></clipPath>`;
    base=`<rect x="20" y="52" width="260" height="196" rx="8" fill="#ece6d6" stroke="#cfc6ae"/><rect x="32" y="64" width="236" height="172" rx="20" fill="#dcb874"/><rect x="40" y="72" width="220" height="156" rx="16" fill="#f1dcae"/>`;
    for(let k=1;k<8;k++)base+=`<line x1="${40+k*27.5}" y1="74" x2="${40+k*27.5}" y2="226" stroke="#d2b47e" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  }else if(cat==='pizza'){
    const pan=size==='pan';
    clip=`<clipPath id="${id}"><circle cx="150" cy="150" r="124"/></clipPath>`;
    base=`<circle cx="150" cy="150" r="146" fill="${pan?'#d9a85c':'#e8c98f'}"/><circle cx="150" cy="150" r="${pan?132:136}" fill="#f1dcae"/><circle cx="150" cy="150" r="126" fill="#f4e2bb"/>`;
  }else if(cat==='sandwich'){
    clip=`<clipPath id="${id}"><rect x="34" y="30" width="108" height="240" rx="38"/><rect x="158" y="30" width="108" height="240" rx="38"/></clipPath>`;
    base=`<rect x="28" y="24" width="120" height="252" rx="44" fill="#d9b67a"/><rect x="152" y="24" width="120" height="252" rx="44" fill="#d9b67a"/><rect x="34" y="30" width="108" height="240" rx="38" fill="#f1e2c2"/><rect x="158" y="30" width="108" height="240" rx="38" fill="#f1e2c2"/>`;
  }else{
    clip=`<clipPath id="${id}"><rect x="22" y="46" width="256" height="208" rx="10"/></clipPath>`;
    base=`<rect x="14" y="38" width="272" height="224" rx="14" fill="#8a8f96"/><rect x="22" y="46" width="256" height="208" rx="10" fill="#ece9e2"/>`;
    const r=rng(7);for(let row=0;row<4;row++)for(let col=0;col<5;col++){const x=50+col*50+(r()-.5)*8,y=78+row*48+(r()-.5)*8;
      base+=`<ellipse cx="${x}" cy="${y}" rx="22" ry="17" fill="#c98a3c" stroke="#a66b26" stroke-width="1.2" transform="rotate(${(r()-.5)*30} ${x} ${y})"/>`}
  }
  const sc=cat==='pizza'?1:.75;let body='';
  layers.forEach((L,li)=>{
    const r=rng(li*977+L.ing.length*131+Math.round(L.amt*100));
    const spread=cat==='pizza'&&(L.ing==='pizzasauce'||L.ing==='ranch');
    const isSauce=ING[L.ing].g==='Sauces'||L.ing==='hotbuffalo_post';
    if(spread){body+=`<circle cx="150" cy="150" r="122" fill="${ING[L.ing].c}" opacity=".93"/>`;return}
    if(isSauce){
      const lines=Math.max(3,Math.min(12,Math.round(L.amt*(cat==='pizza'?3:6))));
      const top=cat==='chicken'?60:34,bot=cat==='chicken'?244:266,step=(bot-top)/lines;let d='';
      for(let k=0;k<lines;k++){const y=top+step*(k+.5);d+=`M10 ${y.toFixed(1)}`;for(let x=10;x<=290;x+=20)d+=` Q${x+10} ${(y+(k%2?-9:9)).toFixed(1)} ${x+20} ${y.toFixed(1)}`}
      body+=`<path d="${d}" fill="none" stroke="${ING[L.ing].c}" stroke-width="${cat==='pizza'?4.5:4}" stroke-linecap="round" opacity=".95"/>`;
      if(L.ing==='ranch'||L.ing==='alfredo'||L.ing==='garlicparm')body=body.replace(/opacity=".95"\/>$/,`opacity=".95" style="filter:drop-shadow(0 0 .6px #9b8f70)"/>`);
      return;
    }
    const n=countFor(L.ing,L.amt);
    for(let k=0;k<n;k++){const[x,y]=pt(cat,r);body+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.round(r()*360)}) scale(${sc})">${sprite(L.ing,r)}</g>`}
  });
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Current build"><defs>${clip}</defs>${base}<g clip-path="url(#${id})">${body}</g></svg>`;
}

    it.groups.forEach((g,gi)=>g.forEach(([ing,a],k)=>{rows+=`<tr class="${gi&&!k?'gstart':''}"><td>${k?'':gi+1}</td><td>${esc(ING[ing].n)}</td>${a.map(v=>`<td class="num">${fmt(v,ing)}</td>`).join('')}</tr>`}));
    let pan='';it.pan.forEach((g,gi)=>g.forEach(([ing,a],k)=>{pan+=`<tr class="${gi&&!k?'gstart':''}"><td>${k?'':gi+1}</td><td>${esc(ING[ing].n)}</td><td class="num">${fmt(a,ing)}</td></tr>`}));
    return `<div class="tbl-wrap"><table><thead><tr><th>Step</th><th>Ingredient</th><th class="num">10"</th><th class="num">12"</th><th class="num">14"</th><th class="num">16"</th></tr></thead><tbody>${rows}</tbody></table></div>
     <div class="tbl-wrap"><table><thead><tr><th>Pan</th><th>Ingredient</th><th class="num">12"</th></tr></thead><tbody>${pan}</tbody></table></div><div class="hint">Ounces, except pepperoni and ham (pieces) and American (slices).</div>`;
  }
  it.groups.forEach((g,gi)=>g.forEach(([ing,a],k)=>{rows+=`<tr class="${gi&&!k?'gstart':''}"><td>${k?'':gi+1}</td><td>${esc(ING[ing].n)}</td><td class="num">${fmt(a,ing)} ${unit(ing)}</td></tr>`}));
  return `<div class="tbl-wrap"><table><thead><tr><th>Step</th><th>Ingredient</th><th class="num">Portion</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
// ---------- Portion Drill ----------
let D={topic:'all',q:null,picked:null,right:0,total:0,streak:0};
const DTOPICS={all:'Everything',tops:'BYO Toppings',sauce:'Sauce & Cheese',pan:'Pan & NY',domino:'Domino',sides:'Breads & Pasta'};
const szs=['10"','12"','14"','16"'];
function fv(v,u){if(u==='oz')return(v<0.1?v.toFixed(2):(Math.round(v*10)/10).toFixed(1))+' oz';return u?v+' '+u:String(v)}
function mkQ(q,src,ans,pool,u){
  const p=[...new Set(pool)].filter(x=>!eq(x,ans)).sort((a,b)=>Math.abs(a-ans)-Math.abs(b-ans));
  const d=p.slice(0,6).sort(()=>Math.random()-.5).slice(0,3);
  const lad=u==='oz'?[.2,.5,.7,1,1.5,2,2.5,3,3.5,4,4.5,5,6,7,8]:[1,2,4,5,6,7,8,9,12,14,16,18,20,24];
  for(const c of lad){if(d.length>=3)break;if(!eq(c,ans)&&!d.some(y=>eq(y,c)))d.push(c)}
  return{q,src,ans:fv(ans,u),opts:[ans,...d].sort((a,b)=>a-b).map(v=>fv(v,u))};
}
const flat=o=>Object.values(o).flatMap(v=>Array.isArray(v)?v:typeof v==='object'?flat(v):[v]);
const GEN={
  domino(){
    if(Math.random()<.4){const f=pick([['Domino: provolone',DOM.prov],['Domino: pizza cheese',DOM.cheese],['Domino: pizza sauce (regular)',DOM.sauceR],['Domino: pizza sauce (light)',DOM.sauceL],['Domino: any other sauce (regular)',DOM.otherR],['Domino: any other sauce (light)',DOM.otherL],['Domino cheese only: extra pizza cheese on top of the sauce',DOM.cheeseOnly]]);
      return mkQ(f[0]+'?','Domino portions card',f[1],[.5,.7,1,1.5,2,2.5,3],'oz')}
    const n=pick([1,2,3]),pp=pick(n===3?['r','l']:['r','l','x']),pep=Math.random()<.35,lbl={r:'Regular',l:'Light',x:'Extra'}[pp];
    if(Math.random()<.12)return{q:'Domino: what is the most toppings it can have?',src:'Domino portions card',ans:'3',opts:['2','3','4','5']};
    return mkQ(`Domino, ${n}-topping: ${lbl} ${pep?'pepperoni or ham':'portion of any other topping'}?`,'Domino portions card',DOM.tops[n][pp][pep?0:1],Object.values(DOM.tops).flatMap(t=>Object.values(t).map(a=>a[pep?0:1])),pep?'slices':'oz');
  },
  tops(){
    if(Math.random()<.25){const ing=pick(['cheddar','prov','parm','feta','american']),a=ALLPZ[ing],c=Math.floor(Math.random()*4),x=Math.random()<.4;
      return mkQ(`${szs[c]} pizza, any topping count: how much ${ING[ing].n}${x?' (Extra)':''}?`,a.label+' chart',a[x?'x':'r'][c],[...a.r,...a.x],ing==='american'?'slices':'oz')}
    const g=pick(Object.values(TOPS)),ing=pick(g.ings),k=pick(g.twoPlus?['1','23']:['1','23','4']),c=Math.floor(Math.random()*4),x=Math.random()<.35;
    const lbl=g.twoPlus&&k==='23'?'2+ topping':countLabel(k);
    return mkQ(`${szs[c]} ${lbl} pizza: how much ${ING[ing].n}${x?' (Extra)':''}?`,g.label+' chart',g.t[k][x?'x':'r'][c],flat(g.t),ing==='pep'||ing==='ham'?'slices':'oz');
  },
  sauce(){
    const c=Math.floor(Math.random()*4);
    if(Math.random()<.5){const opts=[['Pizza Sauce',STD_SAUCE.pizzasauce],['Pacific Veggie sauce',PV_SAUCE],['Honey BBQ',STD_SAUCE.honeybbq],['Alfredo, Garlic Parm or Ranch',STD_SAUCE.ranch]];const[n,a]=pick(opts);
      return mkQ(`Standard ${n} on a ${szs[c]} Hand Tossed, Thin, Gluten Free or Stuffed Crust?`,'Standard sauce chart',a[c],flat(opts.map(o=>o[1])),'oz')}
    const just=Math.random()<.5,x=Math.random()<.4,a=HT_CHEESE[(just?'just':'with')+(x?'X':'R')];
    return mkQ(`Pizza cheese, ${szs[c]} Hand Tossed ${just?'just cheese':'with toppings'}: ${x?'extra cheese top layer':'regular bottom layer'}?`,'Pizza cheese chart (HT, Thin, GF, Stuffed)',a[c],flat(HT_CHEESE),'oz');
  },
  pan(){
    const r=Math.random();
    if(r<.4){const f=pick([['Pan pizza: provolone around the pan',PAN.prov],['Pan pizza: pizza sauce',PAN.sauce],['Pan pizza: Pacific Veggie sauce',PAN.pvSauce],['Pan with toppings: pizza cheese (regular)',PAN.withR],['Pan with toppings: extra cheese top layer',PAN.withX],['Pan just cheese: pizza cheese (regular)',PAN.justR],['Pan just cheese: extra cheese top layer',PAN.justX]]);
      return mkQ(f[0]+'?','Pan pizza chart',f[1],[...flat(PAN),2,2.5,3.5,5],'oz')}
    const i=Math.floor(Math.random()*3),s=['12"','14"','16"'][i];
    if(r<.55)return{q:`A ${s} New York Style is stretched from which dough?`,src:'Edge stretch',ans:['10"','12"','14"'][i],opts:['10"','12"','14"','16"']};
    const f=pick([['pizza sauce',NY.sauce],['pizza cheese',NY.cheese],['shredded provolone',NY.prov]]);
    return mkQ(`${s} New York Style: ${f[0]}?`,'New York Style chart',f[1][i],flat(NY),'oz');
  },
  sides(){
    const facts=[
      ['Stuffed Cheesy Bread: pizza cheese on the bottom half',1.5,'oz',[1,2,2.5,3]],['Stuffed Cheesy Bread: cheddar cheese blend on top',3,'oz',[1.5,2,2.5,4]],
      ['Stuffed Cheesy Bread, Spinach & Feta: spinach',.5,'oz',[.2,.7,1,1.5]],['Stuffed Cheesy Bread, Spinach & Feta: feta',.5,'oz',[.2,.7,1,1.5]],
      ['Stuffed Cheesy Bread, Bacon & Jalapeño: bacon',1,'oz',[.5,.7,1.5,2]],['Stuffed Cheesy Bread, Bacon & Jalapeño: jalapeño',.7,'oz',[.5,1,1.5]],
      ['Stuffed Cheesy Bread, Pepperoni: how many pepperoni',14,'pcs',[12,16,18,20]],['Stuffed Cheesy Bread: how many cuts',7,'cuts',[6,8,9]],
      ['Chicken Alfredo: pasta',5.5,'oz',[4,4.5,5,6]],['Chicken Alfredo: chicken',2,'oz',[1.5,2.5,3]],['Chicken Alfredo: alfredo sauce',4,'oz',[3,3.5,4.5,5]],
      ['5-Cheese Mac & Cheese: pasta',5.5,'oz',[4,4.5,5,6]],['5-Cheese Mac & Cheese: shredded parm asiago',.2,'oz',[.5,.7,1]],['5-Cheese Mac & Cheese: cheddar cheese blend',2,'oz',[1,1.5,2.5,3]],
      ['5-Cheese Mac & Cheese: American cheese slices (cut into 4 triangles)',2,'slices',[1,3,4]],['Spicy Buffalo Mac & Cheese: post-bake hot buffalo',.5,'oz',[.7,1,1.5]]];
    if(Math.random()<.08)return{q:'Stuffed Cheesy Bread: stretch the Pan dough ball to what size before cutting it in half?',src:'Bread side procedures',ans:'16" x 10"',opts:['12" x 12"','14" x 10"','16" x 10"','16" x 12"']};
    const f=pick(facts);return mkQ(f[0]+'?',f[0].startsWith('Stuffed')?'Bread side procedures':'Pasta portions',f[1],f[3],f[2]);
  }
};
function nextDrill(){const t=D.topic==='all'?pick(['tops','tops','sauce','pan','sides','domino']):D.topic;D.q=GEN[t]();D.picked=null}
function drillHTML(){
  if(!D.q)nextDrill();const q=D.q;
  const opts=q.opts.map((o,i)=>{let cls='';if(D.picked!=null){if(o===q.ans)cls=' correct';else if(i===D.picked)cls=' wrong'}
    return `<button class="dopt${cls}" data-a="dans" data-v="${i}" ${D.picked!=null?'disabled':''}>${esc(o)}</button>`}).join('');
  const fb=D.picked==null?'':q.opts[D.picked]===q.ans?`<div class="dfb v-good">Correct.</div>`:`<div class="dfb v-bad">Not quite. The chart says ${esc(q.ans)}.</div>`;
  return `<div class="controls"><div class="seg">${Object.entries(DTOPICS).map(([k,l])=>`<button aria-pressed="${D.topic===k}" data-a="dtopic" data-v="${k}">${l}</button>`).join('')}</div></div>
   <div class="rushbar"><div><div class="k">Score</div><div class="v">${D.right}/${D.total}</div></div><div><div class="k">Streak</div><div class="v">${D.streak}</div></div><div><div class="k">Best streak</div><div class="v">${STORE.drillBest||0}</div></div></div>
   <div class="panel dcard"><div class="lbl">${esc(q.src)}</div><div class="dq">${esc(q.q)}</div><div class="dopts">${opts}</div>${fb}
   <div class="actions"><button class="btn ${D.picked!=null?'primary big':''}" data-a="dnext">${D.picked!=null?'Next question':'Skip'}</button></div></div>`;
}
function chartTable(title,rows,cols){
  return `<div class="panel chart"><h3>${esc(title)}</h3><div class="tbl-wrap"><table><thead><tr><th></th>${cols.map(c=>`<th class="num">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(([l,a,u])=>`<tr><td>${esc(l)}</td>${a.map(v=>`<td class="num">${u==='ct'?v:fv(v,'oz').replace(' oz','')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function byoChartsHTML(){
  let h=`<div class="key"><h3>How BYO portions work</h3><ul>
   <li>Topping portions depend on how many toppings are on the pizza: 1, 2-3, or 4+. Spinach has a 1 and a 2+ column.</li>
   <li>Cheddar, provolone, parm/asiago, feta and American use one portion on all pizzas.</li>
   <li>Pan: provolone 4.0, sauce 3.0, cheese 3.0 (the 4-3-3 rule), then 12" BYO topping portions.</li>
   <li>New York Style gets half the standard cheese portion plus provolone, and cheese-only NY uses the same cheese portions as NY with toppings.</li>
   <li>Extra cheese is a top layer added on top of the bottom layer.</li></ul></div><div class="charts">`;
  Object.values(TOPS).forEach(g=>{const rows=[];Object.entries(g.t).forEach(([k,t])=>{if(g.twoPlus&&k==='4')return;const l=g.twoPlus&&k==='23'?'2+ topping':countLabel(k);rows.push([l,t.r,g.ings[0]==='pep'?'ct':''],[l+' extra',t.x,g.ings[0]==='pep'?'ct':''])});h+=chartTable(g.label,rows,szs)});
  h+=chartTable('Cheeses, all pizzas',[['Cheddar & Provolone',ALLPZ.cheddar.r],['Cheddar & Provolone extra',ALLPZ.cheddar.x],['Parm/Asiago & Feta',ALLPZ.parm.r],['Parm/Asiago & Feta extra',ALLPZ.parm.x],['American (slices)',ALLPZ.american.r,'ct'],['American extra (slices)',ALLPZ.american.x,'ct']],szs);
  h+=chartTable('Standard sauce: HT, Thin, GF, NY, Stuffed',[['Pizza Sauce',STD_SAUCE.pizzasauce],['Pacific Veggie',PV_SAUCE],['Honey BBQ',STD_SAUCE.honeybbq],['Alfredo, Garlic Parm & Ranch',STD_SAUCE.ranch]],szs);
  h+=chartTable('Pizza cheese: HT, Thin, GF, Stuffed',[['With toppings, bottom',HT_CHEESE.withR],['With toppings, extra top',HT_CHEESE.withX],['Just cheese, bottom',HT_CHEESE.justR],['Just cheese, extra top',HT_CHEESE.justX]],szs);
  h+=chartTable('Pan pizza (12")',[['Provolone',[PAN.prov]],['Sauce',[PAN.sauce]],['Pacific Veggie sauce',[PAN.pvSauce]],['Cheese with toppings',[PAN.withR]],['Extra, with toppings',[PAN.withX]],['Cheese, just cheese',[PAN.justR]],['Extra, just cheese',[PAN.justX]]],['12"']);
  h+=chartTable('New York Style',[['1. Sauce',NY.sauce],['2. Pizza cheese',NY.cheese],['3. Shredded provolone',NY.prov]],['12"','14"','16"']);
  h+=`<div class="panel chart"><h3>NY edge stretch</h3><ul style="margin:0;padding-left:18px"><li>10" dough makes a 12" NY</li><li>12" dough makes a 14" NY</li><li>14" dough makes a 16" NY</li></ul></div></div>`;
  return h;
}
function dominoChartsHTML(){
  const rows=[];[1,2,3].forEach(n=>['r','l','x'].forEach(p=>{const a=DOM.tops[n][p];if(a)rows.push([`${n}-topping ${({r:'regular',l:'light',x:'extra'})[p]}`,a])}));
  return `<div class="key"><h3>Domino rules</h3><ul>
   <li>Provolone 2.0 and pizza cheese 2.0 go down first, then the sauce.</li>
   <li>All toppings go on top of the sauce.</li>
   <li>Cheese only gets an extra 1.0 oz pizza cheese on top of the sauce.</li>
   <li>Extra pizza cheese counts as a topping and uses the regular topping portion.</li>
   <li>3 toppings is the maximum, and extra isn't allowed at 3 toppings.</li></ul></div><div class="charts">
   ${chartTable('Sauce & cheese',[['Provolone',[DOM.prov]],['Pizza cheese',[DOM.cheese]],['Pizza sauce, regular',[DOM.sauceR]],['Pizza sauce, light',[DOM.sauceL]],['All other sauces, regular',[DOM.otherR]],['All other sauces, light',[DOM.otherL]]],['oz'])}
   <div class="panel chart"><h3>Toppings</h3><div class="tbl-wrap"><table><thead><tr><th></th><th class="num">Pep & Ham</th><th class="num">All other (oz)</th></tr></thead><tbody>${rows.map(([l,a])=>`<tr><td>${l}</td><td class="num">${a[0]}</td><td class="num">${fv(a[1],'oz').replace(' oz','')}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
function reviewHTML(){
  if(V.phase==='run')return `<div class="rushbar"><div><div class="k">Missed review</div><div class="v">${V.i+1} of ${V.queue.length}</div></div><div><div class="k">Cleared</div><div class="v">${V.cleared}</div></div></div>`+builderHTML();
  const list=Object.entries(STORE.missed).sort((a,b)=>a[1].pct-b[1].pct);
  const done=V.phase==='done'?`<div class="key"><h3>Review finished</h3><p style="margin:0">You cleared ${V.cleared} of ${V.done} builds. ${list.length?'The rest are still on the list.':'Nothing left to retest.'}</p></div>`:'';
  if(!list.length)return done+`<div class="setup"><h2>Missed Review</h2><p>Any build you score under 100% lands here so you can retest it. Score 100% and it comes off the list. Nothing here right now.</p><button class="btn primary" data-a="tab" data-v="build">Go build something</button></div>`;
  return done+`<div class="setup" style="max-width:none"><h2>Missed Review</h2><p>${list.length} build${list.length>1?'s':''} to retest, lowest score first.</p></div>
   <div class="actions" style="margin:0 0 12px"><button class="btn primary big" data-a="reviewStart">Retest all</button><button class="btn" data-a="reviewClear">Clear list</button></div>
   <div class="review-list">${list.map(([k,v])=>{const[id,s]=k.split('|');const it=itemById(id);if(!it)return '';
     return `<div class="review-item"><div><b>${esc(it.name)}</b> <span class="muted">${s!=='-'?sizeLabel(s)+' · ':''}${esc(CATS[it.cat])}</span><div class="muted" style="font-size:13px">Last score ${v.pct}%</div></div><button class="btn" data-a="reviewOne" data-v="${k}">Retest</button></div>`}).join('')}</div>`;
}
function render(){
  renderTabs();let h='';
  if(tab==='build')h=practiceControls()+builderHTML();
  else if(tab==='rush')h=rushHTML();
  else if(tab==='study')h=studyHTML();
  else if(tab==='drill')h=drillHTML();
  else h=reviewHTML();
  $('#app').innerHTML=h+((tab==='build'||(tab==='rush'&&R.phase==='run')||(tab==='review'&&V.phase==='run'))?sheetHTML():'');
}

// ---------- Rush timer ----------
function tick(){
  if(R.phase!=='run')return;const now=Date.now();
  if(!B.result){R.remaining-=now-R.last}
  R.last=now;const el=$('#rtime');if(el)el.textContent=clock(R.remaining);
  if(R.remaining<=0)endRush();
}
function endRush(){R.phase='done';clearInterval(R.timer);STORE.rushBest=Math.max(STORE.rushBest||0,R.perfect);save();sheet=null;render()}

// ---------- Events ----------
function startPractice(){if(P.cat==='byo'||P.cat==='domino'){const b=P.cat==='byo'?makeByo():makeDomino();loadBuild(b,b.size,'practice');return}
  loadBuild(itemById(P.item),P.cat==='pizza'?P.size:'-','practice')}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT')return;const a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'tab':tab=v;sheet=null;if(v==='build'&&B.mode!=='practice')startPractice();break;
    case 'pcat':P.cat=v;if(v!=='byo'&&v!=='domino')P.item=ITEMS.find(i=>i.cat===v).id;startPractice();break;
    case 'psize':P.size=v;startPractice();break;
    case 'nextRandom':{if(P.cat==='byo'||P.cat==='domino'){startPractice();break}const r=randomTarget(P.cat);P.item=r.item.id;if(r.size!=='-')P.size=r.size;startPractice();break}
    case 'retry':B.layers=[];B.result=null;break;
    case 'dtopic':D.topic=v;nextDrill();break;
    case 'dans':if(D.q&&D.picked==null){D.picked=+v;D.total++;if(D.q.opts[D.picked]===D.q.ans){D.right++;D.streak++;if(D.streak>(STORE.drillBest||0)){STORE.drillBest=D.streak;save()}}else D.streak=0}break;
    case 'dnext':nextDrill();break;
    case 'pick':sheet=v;break;
    case 'close':sheet=null;break;
    case 'add':B.layers.push({ing:sheet,amt:parseFloat(v)});sheet=null;break;
    case 'rm':B.layers.splice(+v,1);break;
    case 'up':{const i=+v;if(i>0){const x=B.layers[i];B.layers[i]=B.layers[i-1];B.layers[i-1]=x}break}
    case 'clear':B.layers=[];break;
    case 'submit':{B.result=grade(stepsFor(B.item,B.size),B.layers);record(B.item,B.size,B.result.pct);
      if(B.mode==='rush'){R.builds++;R.sum+=B.result.pct;if(B.result.pct>=100)R.perfect++}
      if(B.mode==='review'&&B.result.pct>=100)V.cleared++;break}
    case 'skip':{const r=randomTarget(R.cat);loadBuild(r.item,r.size,'rush');break}
    case 'rcat':R.cat=v;break;
    case 'rdur':R.dur=+v;break;
    case 'rushStart':case 'rushAgain':{Object.assign(R,{phase:'run',remaining:R.dur*1000,last:Date.now(),builds:0,perfect:0,sum:0});const r=randomTarget(R.cat);loadBuild(r.item,r.size,'rush');clearInterval(R.timer);R.timer=setInterval(tick,250);break}
    case 'rushNext':{R.last=Date.now();if(R.remaining<=0){endRush();return}const r=randomTarget(R.cat);loadBuild(r.item,r.size,'rush');break}
    case 'rushEnd':endRush();return;
    case 'scat':studyCat=v;break;
    case 'flip':flipped[v]=!flipped[v];break;
    case 'practice':{const it=itemById(v);P.cat=it.cat;P.item=it.id;tab='build';startPractice();break}
    case 'reviewStart':case 'reviewOne':{V.queue=a==='reviewOne'?[v]:Object.entries(STORE.missed).sort((x,y)=>x[1].pct-y[1].pct).map(x=>x[0]);V.i=0;V.cleared=0;V.done=V.queue.length;V.phase='run';loadQueued();break}
    case 'reviewNext':V.i++;if(V.i>=V.queue.length){V.phase='done'}else loadQueued();break;
    case 'reviewClear':STORE.missed={};save();V.phase='list';break;
  }
  render();
  if(a==='submit'||a==='rushNext'||a==='reviewNext'||a==='nextRandom'||a==='skip'){const el=a==='submit'?document.querySelector('.result'):document.querySelector('.order-card');if(el)el.scrollIntoView({block:'start',behavior:'smooth'})}
});
function loadQueued(){const[id,s]=V.queue[V.i].split('|');loadBuild(itemById(id),s,'review')}
document.addEventListener('change',e=>{if(e.target.id==='pitem'){P.item=e.target.value;startPractice();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render()}});

startPractice();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
